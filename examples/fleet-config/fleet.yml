# Example fleet configuration. Put this file to the root of a private Git
# repository (GitHub or Azure DevOps) and point FLEET_GIT_URL to it.
#
# Settings are inherited: defaults < swarm < swarm environment < server.
#
# Servers join a Swarm + Environment by calling its API path
# (FLEET_SWARM / FLEET_ENVIRONMENT in fleet-client), so membership is never
# decided by this repository. Settings of a Swarm or environment, and the
# servers: entries under them, apply only to servers which call that path.
#
# Swarms can live in fleet.yml or in their own files, which can be owned by
# different teams (see CODEOWNERS):
#   swarms/<swarm>.yml                 a Swarm and its environments
#   swarms/<swarm>/<environment>.yml   one environment
# A Swarm or environment can be defined only once.

defaults:
  os_image: burmilla/os            # use your registry mirror here if needed
  os_version: v3.0.0               # tag of os_image
  docker_version: docker-29.9.2    # engine name from `ros engine list`
  upgrade_policy: download         # auto | download | none
  max_concurrent_maintenance: 1    # per Swarm + Environment
  check_interval: 5m
  max_uptime: 90d                  # scheduled restart when uptime exceeds this
  maintenance_window:
    days: [sat, sun]
    start: "02:00"
    duration: 3h
    timezone: Europe/Helsinki
  # SSH access of the rancher and docker users, applied by fleet-client
  # right away (no maintenance lock needed). authorized_keys replaces the
  # keys managed by fleet-client; keys from cloud-config or added by hand
  # are kept. Leave a setting out to not manage it at all.
  ssh:
    authorized_keys:
      - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIOiuTuZpapVCjAUUGcXj2zMLBbrr0QyMsca1UEx+EBWQ alice@example.com
      - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIL85YGKsHVZg1FilB2p/FQs777cdPnqWtr8rfoKImcUU bob@example.com
    # Hardening: stop sshd 10 minutes after boot, as soon as no SSH session
    # is active. sshd starts again after a reboot, or right away with "0".
    disable_after_boot: 10m

# Per-server settings of servers which are not in any Swarm.
servers:
  legacy-01:
    upgrade_policy: none           # pinned, report only
