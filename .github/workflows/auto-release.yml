name: auto-release

# Tags and releases the version in deploy/docker-stack.yml when it reaches
# master without a tag yet. Pushes that don't bump the version do nothing.
on:
  push:
    branches:
      - master

concurrency:
  group: auto-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      created: ${{ steps.tag.outputs.created }}
    steps:
    - uses: actions/checkout@v4

    - name: Read version
      id: version
      run: |
        version=$(sed -n 's|.*image: burmilla/os-fleet-manager:\(v[0-9][^[:space:]]*\).*|\1|p' deploy/docker-stack.yml)
        if [ -z "$version" ]; then
          echo "::error::No version found in deploy/docker-stack.yml"
          exit 1
        fi
        for f in README.md examples/fleet-config/.github/workflows/validate.yml; do
          if grep -q "burmilla/os-fleet-manager:v" "$f" && ! grep -q "burmilla/os-fleet-manager:$version" "$f"; then
            echo "::error file=$f::Version does not match $version in deploy/docker-stack.yml"
            exit 1
          fi
        done
        echo "version=$version" >> "$GITHUB_OUTPUT"

    - name: Create tag and release
      id: tag
      env:
        GH_TOKEN: ${{ github.token }}
        VERSION: ${{ steps.version.outputs.version }}
      run: |
        if git ls-remote --exit-code --tags origin "refs/tags/$VERSION" >/dev/null; then
          echo "$VERSION is already tagged, nothing to release"
          echo "created=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        gh release create "$VERSION" --target "$GITHUB_SHA" --title "$VERSION" --generate-notes
        echo "created=true" >> "$GITHUB_OUTPUT"

  # Tags pushed with GITHUB_TOKEN don't trigger other workflows, so the image
  # build is called directly.
  build:
    needs: tag
    if: needs.tag.outputs.created == 'true'
    uses: ./.github/workflows/release.yml
    with:
      version: ${{ needs.tag.outputs.version }}
    secrets: inherit
