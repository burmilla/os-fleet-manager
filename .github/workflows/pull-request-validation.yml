name: PR
on: pull_request

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-go@v5
      with:
        go-version-file: go.mod

    - name: Test
      run: |
        test -z "$(gofmt -l .)"
        go vet ./...
        go test ./...

    - name: Build image
      run: docker build -t burmilla/os-fleet-manager:pr .
